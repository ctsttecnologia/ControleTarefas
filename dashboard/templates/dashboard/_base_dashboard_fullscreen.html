{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Aplica o tema salvo antes de renderizar (evita flash) -->
    <script>
        (function () {
            const t = localStorage.getItem('theme') ||
                (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>
    {% if next_dashboard_url %}
    <meta http-equiv="refresh" content="{{ cycle_interval_seconds|default:'35' }};url={% url next_dashboard_url %}?cycle=true">
    {% endif %}
    <title>{% block title %}Painel{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    <link rel="stylesheet" href="{% static 'css/pgr-app.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <style>body { padding-top: 0 !important; }</style>
    {% block tv_css %}{% endblock %}
</head>
<body>
    <div class="progress-bar-tv" id="tvBar"
         style="transition-duration: {{ cycle_interval|default:'30000' }}ms;"></div>
    <div class="tv-container">
        {% block tv_content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    {% include "dashboard/_chart_theme.html" %}
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bar = document.getElementById('tvBar');
            if (bar) requestAnimationFrame(() => bar.style.width = '100%');
        });
        // Sincroniza o tema se ele for alterado em outra aba
        addEventListener('storage', e => {
            if (e.key === 'theme' && e.newValue)
                document.documentElement.setAttribute('data-bs-theme', e.newValue);
        });
    </script>
    {% block tv_js %}{% endblock %}
</body>
</html>
