
{% if field %}
<div class="{{ col|default:'col-12' }}">
    {% if field.field.widget.input_type == "checkbox" %}
    <div class="form-check form-switch mt-md-4">
        {{ field }}
        <label class="form-check-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
    </div>
    {% else %}
    <label for="{{ field.id_for_label }}" class="form-label fw-semibold {% if field.field.required %}required-field{% endif %}">
        {{ field.label }}
    </label>
    {{ field }}
    {% endif %}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}
    <div class="invalid-feedback d-block"><i class="fas fa-exclamation-triangle me-1"></i>{{ error }}</div>
    {% endfor %}
</div>
{% endif %}
