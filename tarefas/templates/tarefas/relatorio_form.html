
<!-- templates/tarefas/gerar_relatorio.html -->
{% extends 'base.html' %}
{% load static %}

{% block title %}Gerar Relatório{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/tarefas/relatorios.css' %}">   
{% endblock %}

{% block content %}
<div class="rel-wrapper d-flex justify-content-center">
    <div class="rel-card" style="max-width:560px; width:100%;">
        <div class="rel-card-body">

            <h1 class="rel-title">
                <i class="bi bi-file-earmark-bar-graph me-2"></i>Gerar Relatório
            </h1>
            <p class="rel-subtitle mb-4">Selecione os filtros e o formato de exportação</p>

            <form method="get" action="{% url 'tarefas:relatorio_display' %}">
                <div class="rel-section">
                    <span class="rel-section-icon"><i class="bi bi-funnel"></i></span>
                    <h6 class="rel-card-title">Filtros</h6>
                </div>

                <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select name="status" id="status" class="form-select form-select-sm">
                        <option value="">Todos os status</option>
                        {% for key, value in status_choices %}
                        <option value="{{ key }}" {% if request.GET.status == key %}selected{% endif %}>{{ value }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="rel-export-btn rel-export-btn--screen mb-4">
                    <i class="bi bi-display"></i> Ver na Tela
                </button>
            </form>

            <hr>

            <div class="rel-section">
                <span class="rel-section-icon"><i class="bi bi-download"></i></span>
                <h6 class="rel-card-title">Exportar</h6>
            </div>

            <div class="rel-export-grid">
                <a href="{% url 'tarefas:exportar_relatorio' %}?formato=pdf&{{ request.GET.urlencode }}" class="rel-export-btn rel-export-btn--pdf">
                    <i class="bi bi-file-earmark-pdf"></i> PDF
                </a>
                <a href="{% url 'tarefas:exportar_relatorio' %}?formato=xlsx&{{ request.GET.urlencode }}" class="rel-export-btn rel-export-btn--xlsx">
                    <i class="bi bi-file-earmark-excel"></i> Excel
                </a>
                <a href="{% url 'tarefas:exportar_relatorio' %}?formato=docx&{{ request.GET.urlencode }}" class="rel-export-btn rel-export-btn--docx">
                    <i class="bi bi-file-earmark-word"></i> Word
                </a>
                <a href="{% url 'tarefas:exportar_relatorio' %}?formato=csv&{{ request.GET.urlencode }}" class="rel-export-btn rel-export-btn--csv">
                    <i class="bi bi-filetype-csv"></i> CSV
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
