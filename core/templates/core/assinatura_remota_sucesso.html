{# templates/core/assinatura_remota_sucesso.html #}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Assinatura Concluída</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --pub-bg: #f4f5f7;
            --pub-card-bg: #ffffff;
            --pub-text: #1a1a1a;
            --pub-text-muted: #555555;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --pub-bg: #14161f;
                --pub-card-bg: #1e2130;
                --pub-text: #e2e8f0;
                --pub-text-muted: #94a3b8;
            }
        }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--pub-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: var(--pub-card-bg);
            color: var(--pub-text);
            padding: 32px 24px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            max-width: 400px;
        }
        .icone { font-size: 48px; color: #16a34a; margin-bottom: 12px; }
        h1 { font-size: 18px; margin-bottom: 8px; }
        p { font-size: 14px; color: var(--pub-text-muted); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icone">✓</div>
        <h1>Assinatura registrada com sucesso!</h1>
        <p>Pode fechar esta página.</p>
    </div>
</body>
</html>
