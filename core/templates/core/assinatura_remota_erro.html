
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Link Inválido</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 32px 24px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            max-width: 400px;
        }
        .icone { font-size: 48px; color: #dc2626; margin-bottom: 12px; }
        h1 { font-size: 18px; color: #1a1a1a; margin-bottom: 8px; }
        p { font-size: 14px; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icone">✕</div>
        <h1>Link expirado ou já utilizado</h1>
        <p>Solicite um novo link de assinatura ao responsável.</p>
    </div>
</body>
</html>
